<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Logopedia Rush</title>
    <link rel="stylesheet" href="styles.css?v=3" />
  </head>
  <body>
    <div class="app">
      <header class="topbar">
        <div class="brand">
          <div class="logo"></div>
          <div>
            <div class="title">Logopedia Rush</div>
            <div class="subtitle">Speech Therapy Clinic — Day <span id="day">1</span></div>
          </div>
        </div>
        <div class="stats">
          <div class="stat">
            <div class="label">Time Left</div>
            <div class="value" id="timeLeft">60</div>
          </div>
          <div class="stat">
            <div class="label">Score</div>
            <div class="value" id="score">0</div>
          </div>
          <div class="stat">
            <div class="label">Target</div>
            <div class="value" id="target">60</div>
          </div>
        </div>
      </header>

      <main class="main">
        <section class="office minimalist">
          <div class="office-bg"></div>
          <div class="desk-line"></div>

          <div class="ui-layer">
            <div class="hud">
              <div class="panel-title">Daily Goal</div>
              <div class="goal">
                <div class="goal-bar">
                  <div class="goal-fill" id="goalFill"></div>
                </div>
                <div class="goal-text" id="goalText">0 / 60</div>
              </div>
              <div class="panel-title">Status</div>
              <div class="status" id="status">Day 1 — keep the queue calm.</div>
            </div>

            <div class="patient-zone">
              <div class="zone-title">Patients</div>
              <div class="queue" id="queue"></div>
            </div>

            <div class="prep-area">
              <div class="panel-title">Prep</div>
              <div class="prep-grid" id="prepGrid"></div>
            </div>

            <div class="exercise-buttons">
              <button class="pixel-btn" data-ex="Articulation" aria-label="Articulation">
                <span class="icon"></span>
                <span class="label">Articulation</span>
              </button>
              <button class="pixel-btn" data-ex="Fluency" aria-label="Fluency">
                <span class="icon"></span>
                <span class="label">Fluency</span>
              </button>
              <button class="pixel-btn" data-ex="Voice" aria-label="Voice">
                <span class="icon"></span>
                <span class="label">Voice</span>
              </button>
            </div>
          </div>
        </section>
      </main>

      <footer class="footer">
        <div class="controls">
          <button class="btn ghost" id="startBtn">Start Day</button>
          <button class="btn ghost" id="pauseBtn" disabled>Pause</button>
          <button class="btn ghost" id="resetBtn">Reset</button>
        </div>
        <div class="help">Deliver matching exercises before patience runs out. Wrong match lowers score.</div>
      </footer>
    </div>

    <div class="overlay hidden" id="overlay">
      <div class="card">
        <div class="card-title" id="overlayTitle">Successful logopedia!</div>
        <div class="card-body" id="overlayBody"></div>
        <div class="card-actions">
          <button class="btn" id="nextDayBtn">New Session</button>
        </div>
      </div>
    </div>

    <script src="game.js?v=3"></script>
  </body>
</html>
